<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAE Font Awesome Icons</title>
  <style>
    body {
      display: flex;
      gap: 40px;
      padding: 50px;
      background-color: #f8f9fa;
      font-family: sans-serif;
      color: #333;
    }
    .icon-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }
    /* Acts exactly like a Font Awesome class */
    .cae-icon {
      width: 64px;
      height: 64px;
      transition: color 0.2s ease;
    }
    /* Test hover states */
    .icon-container:hover .icon-ansa { color: #0055a4; }
    .icon-container:hover .icon-meta { color: #d62828; }
    .icon-container:hover .icon-primer { color: #0077b6; }
    .icon-container:hover .icon-lsdyna { color: #f77f00; }
  </style>
</head>
<body>

  <!-- ANSA ICON -->
  <div class="icon-container">
    <svg class="cae-icon icon-ansa" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
      <!-- Structured mesh 'A' -->
      <path d="M256 16 L16 464 H496 Z" fill="none" stroke="currentColor" stroke-width="48" stroke-linejoin="round"/>
      <path d="M136 240 H376 M76 352 H436 M256 16 V464 M136 240 L256 464 M376 240 L256 464" fill="none" stroke="currentColor" stroke-width="32" stroke-linejoin="round"/>
    </svg>
    <strong>ANSA</strong>
  </div>

  <!-- META ICON -->
  <div class="icon-container">
    <svg class="cae-icon icon-meta" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
      <!-- Plot/Graph 'M' -->
      <path d="M32 464 V128 L176 320 L336 96 L480 352" fill="none" stroke="currentColor" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M32 464 H480" fill="none" stroke="currentColor" stroke-width="48" stroke-linecap="round"/>
      <circle cx="176" cy="320" r="32" fill="currentColor"/>
      <circle cx="336" cy="96" r="32" fill="currentColor"/>
      <circle cx="480" cy="352" r="32" fill="currentColor"/>
    </svg>
    <strong>META</strong>
  </div>

  <!-- PRIMER ICON -->
  <div class="icon-container">
    <svg class="cae-icon icon-primer" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
      <!-- Assembly Linkage 'P' -->
      <path d="M112 32 V480" fill="none" stroke="currentColor" stroke-width="48" stroke-linecap="round"/>
      <path d="M112 32 H336 C424.4 32 496 103.6 496 192 C496 280.4 424.4 352 336 352 H112" fill="none" stroke="currentColor" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="288" cy="192" r="40" fill="currentColor"/>
      <path d="M112 192 H248" fill="none" stroke="currentColor" stroke-width="32"/>
    </svg>
    <strong>PRIMER</strong>
  </div>

  <!-- LS-DYNA ICON -->
  <div class="icon-container">
    <svg class="cae-icon icon-lsdyna" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
      <!-- Hexahedral Element -->
      <path d="M128 224 L320 224 L320 448 L128 448 Z" fill="none" stroke="currentColor" stroke-width="40" stroke-linejoin="round"/>
      <path d="M224 64 L416 64 L416 288 L224 288 Z" fill="none" stroke="currentColor" stroke-width="40" stroke-linejoin="round"/>
      <path d="M128 224 L224 64 M320 224 L416 64 M320 448 L416 288 M128 448 L224 288" fill="none" stroke="currentColor" stroke-width="40" stroke-linecap="round"/>
      <!-- Nodes -->
      <circle cx="128" cy="224" r="28" fill="currentColor"/>
      <circle cx="320" cy="224" r="28" fill="currentColor"/>
      <circle cx="320" cy="448" r="28" fill="currentColor"/>
      <circle cx="128" cy="448" r="28" fill="currentColor"/>
      <circle cx="224" cy="64" r="28" fill="currentColor"/>
      <circle cx="416" cy="64" r="28" fill="currentColor"/>
      <circle cx="416" cy="288" r="28" fill="currentColor"/>
      <circle cx="224" cy="288" r="28" fill="currentColor"/>
    </svg>
    <strong>LS-DYNA</strong>
  </div>

</body>
</html>
